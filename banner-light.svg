<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Achintya Agrawal. CS at the University of Washington. Building the distributed systems AI runs on. Distributed systems, ML infrastructure, reliability.">
  <style>
    .name  { font: 600 58px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #14213D; letter-spacing: -0.5px; }
    .line2 { font: 400 22px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #4A5878; }
    .tag   { font: 500 24px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #14213D; }
    .label { font: 500 15px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #56627E; letter-spacing: 0.2px; }
    .cap   { font: 500 14px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #56627E; }
    /* Moving elements: 5 heartbeats + 1 packet, one shared 6 s cycle */
    .pulse  { fill: #C0761A; opacity: 0; animation: 6s ease-in-out infinite; }
    .packet { fill: #C0761A; opacity: 0; animation: pk 6s ease-in-out infinite; }
    @keyframes hb1 { 0% { transform: translate(0,0); opacity: 0 } 4% { opacity: 1 }
      30% { transform: translate(110px,0px); opacity: 1 } 34%, 100% { transform: translate(110px,0px); opacity: 0 } }
    @keyframes hb2 { 0% { transform: translate(0,0); opacity: 0 } 4% { opacity: 1 }
      30% { transform: translate(34px,-90px); opacity: 1 } 34%, 100% { transform: translate(34px,-90px); opacity: 0 } }
    @keyframes hb3 { 0% { transform: translate(0,0); opacity: 0 } 4% { opacity: 1 }
      30% { transform: translate(-89px,-56px); opacity: 1 } 34%, 100% { transform: translate(-89px,-56px); opacity: 0 } }
    @keyframes hb4 { 0% { transform: translate(0,0); opacity: 0 } 4% { opacity: 1 }
      30% { transform: translate(-89px,56px); opacity: 1 } 34%, 100% { transform: translate(-89px,56px); opacity: 0 } }
    @keyframes hb5 { 0% { transform: translate(0,0); opacity: 0 } 4% { opacity: 1 }
      30% { transform: translate(34px,90px); opacity: 1 } 34%, 100% { transform: translate(34px,90px); opacity: 0 } }
    @keyframes pk { 0%, 36% { transform: translate(0,0); opacity: 0 } 40% { opacity: 1 }
      66% { transform: translate(100px,0); opacity: 1 } 70%, 100% { transform: translate(100px,0); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .pulse, .packet { animation: none; opacity: 0; } }
  </style>

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/><stop offset="1" stop-color="#E8EEF7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- Text block (left, ends before x = 700) -->
  <text x="72" y="120" class="name">Achintya Agrawal</text>
  <text x="74" y="166" class="line2">CS at the University of Washington</text>
  <text x="74" y="204" class="tag">Building the distributed systems AI runs on</text>
  <text x="74" y="250" class="label">Distributed systems · ML infrastructure · Reliability</text>

  <!-- Cluster: peer ring and leader-to-follower links -->
  <ellipse cx="900" cy="160" rx="110" ry="95" fill="none" stroke="#B8C6DC" stroke-width="1.5" stroke-dasharray="2 7"/>
  <g stroke="#B8C6DC" stroke-width="1.5">
    <line x1="900" y1="160" x2="1010" y2="160"/>
    <line x1="900" y1="160" x2="934" y2="70"/>
    <line x1="900" y1="160" x2="811" y2="104"/>
    <line x1="900" y1="160" x2="811" y2="216"/>
    <line x1="900" y1="160" x2="934" y2="250"/>
  </g>

  <!-- Follower 1 feeds the model core -->
  <line x1="1010" y1="160" x2="1098" y2="160" stroke="#2F5D9E" stroke-width="1.5" opacity="0.6"/>

  <!-- Heartbeats from the leader (drawn under the nodes so they arrive "into" them) -->
  <circle class="pulse" style="animation-name: hb1" cx="900" cy="160" r="4"/>
  <circle class="pulse" style="animation-name: hb2" cx="900" cy="160" r="4"/>
  <circle class="pulse" style="animation-name: hb3" cx="900" cy="160" r="4"/>
  <circle class="pulse" style="animation-name: hb4" cx="900" cy="160" r="4"/>
  <circle class="pulse" style="animation-name: hb5" cx="900" cy="160" r="4"/>
  <circle class="packet" cx="1010" cy="160" r="4"/>

  <!-- Followers -->
  <g fill="#FFFFFF" stroke="#2F5D9E" stroke-width="1.75">
    <circle cx="1010" cy="160" r="12"/>
    <circle cx="934" cy="70" r="12"/>
    <circle cx="811" cy="104" r="12"/>
    <circle cx="811" cy="216" r="12"/>
    <circle cx="934" cy="250" r="12"/>
  </g>
  <g fill="#2F5D9E">
    <circle cx="1010" cy="160" r="3"/>
    <circle cx="934" cy="70" r="3"/>
    <circle cx="811" cy="104" r="3"/>
    <circle cx="811" cy="216" r="3"/>
    <circle cx="934" cy="250" r="3"/>
  </g>

  <!-- Leader: heavier outline plus an outer ring -->
  <circle cx="900" cy="160" r="26" fill="none" stroke="#2F5D9E" stroke-width="1" opacity="0.45"/>
  <circle cx="900" cy="160" r="17" fill="#FFFFFF" stroke="#2F5D9E" stroke-width="2.5"/>
  <circle cx="900" cy="160" r="5" fill="#2F5D9E"/>

  <!-- Model core: a tile of weights -->
  <rect x="1098" y="138" width="44" height="44" rx="8" fill="#FFFFFF" stroke="#2F5D9E" stroke-width="1.75"/>
  <g fill="#2F5D9E" opacity="0.4">
    <rect x="1106" y="146" width="12" height="12" rx="2"/><rect x="1122" y="146" width="12" height="12" rx="2"/>
    <rect x="1106" y="162" width="12" height="12" rx="2"/><rect x="1122" y="162" width="12" height="12" rx="2"/>
  </g>
  <text x="1120" y="206" text-anchor="middle" class="cap">model</text>
</svg>